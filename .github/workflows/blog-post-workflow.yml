name: Update profile content

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-updaters
  cancel-in-progress: false

jobs:
  update-profile-content:
    name: Update README profile content
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pipeline tests
        run: node --test test/*.test.mjs

      - name: Update latest blog posts from RSS feed
        run: node scripts/update-blog-posts.mjs

      - name: Update featured project stars
        run: node scripts/update-project-stars.mjs

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if git diff --quiet -- README.md; then
              echo "README is already up to date"
              exit 0
            fi

            git add README.md
            git commit -m "docs: update profile content"

            if git push; then
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; refreshing from main" >&2
            git fetch origin main
            git reset --hard origin/main
            node scripts/update-blog-posts.mjs
            node scripts/update-project-stars.mjs
            sleep $((attempt * 5))
          done

          echo "Could not publish README update after 3 attempts" >&2
          exit 1
